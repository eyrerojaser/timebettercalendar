[build]
  publish = "."

[build.environment]
  # @netlify/blobs necesita Node 22.12 o más nuevo al instalar
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Enlace corto de afiliada: /r/CODIGO  ->  página de compra con el código
[[redirects]]
  from = "/r/:code"
  to = "/comprar.html?ref=:code"
  status = 302
  force = true
